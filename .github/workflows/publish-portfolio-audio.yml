name: Publish portfolio narration audio

on:
  push:
    branches:
      - main
    paths:
      - ".portfolio-audio-source"

permissions:
  contents: write

jobs:
  publish-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download and validate recorded narration
        shell: bash
        run: |
          set -euo pipefail
          url="$(cat .portfolio-audio-source)"
          mkdir -p assets/audio
          curl --fail --location --retry 3 --silent --show-error "$url" --output assets/audio/portfolio-welcome.mp3
          test -s assets/audio/portfolio-welcome.mp3
          file assets/audio/portfolio-welcome.mp3
          if ! file assets/audio/portfolio-welcome.mp3 | grep -Eqi 'MPEG|MP3|audio'; then
            echo "Downloaded file does not appear to be an audio file."
            exit 1
          fi

      - name: Publish stable audio asset
        shell: bash
        run: |
          set -euo pipefail
          rm .portfolio-audio-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/portfolio-welcome.mp3
          git add -u .portfolio-audio-source
          git commit -m "Publish continuous portfolio welcome narration [skip ci]"
          git push